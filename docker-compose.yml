services:
  db:
    image: postgres:16-alpine
    container_name: fadaa_locative_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_HOST_PORT:-5435}:5432"
    volumes:
      - fadaa_locative_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10


##backend
  backend:
    build:
      context: ./gestion-location-backend
      dockerfile: Dockerfile
    container_name: fadaa_locative_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./gestion-location-backend:/app
    command: >
     sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

##frontend
  frontend:
      build:
        context: ./gestion-location-frontend
        dockerfile: Dockerfile
      container_name: fadaa_locative_frontend
      restart: unless-stopped
      ports:
        - "3000:3000"
      depends_on:
        - backend
      volumes:
        - ./gestion-location-frontend:/app
        - /app/node_modules
        - /app/.next
      command: npm run dev
volumes:
  fadaa_locative_db_data: